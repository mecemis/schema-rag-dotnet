name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore SchemaRag.slnx

      - name: Verify formatting
        run: dotnet format SchemaRag.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SchemaRag.slnx --configuration Release --no-restore

      - name: Test with coverage gate
        run: >-
          dotnet test SchemaRag.slnx
          --configuration Release
          --no-build
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Include="[SchemaRag.Application]*"
          /p:Threshold=80
          /p:ThresholdType=line

      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build API container
        run: docker compose --env-file .env.example build api
