<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-labelledby="title description">
  <title id="title">SchemaRag natural-language query flow</title>
  <desc id="description">A question is embedded, matched with schema documents, converted to SQL by Ollama, validated, and executed read-only in PostgreSQL.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1400" height="300" rx="28" fill="url(#background)"/>
  <text x="70" y="58" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">From question to guarded PostgreSQL</text>
  <text x="70" y="88" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Retrieval narrows context. The backend keeps control of validation and execution.</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(55 126)">
      <rect width="175" height="105" rx="18" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="28" cy="27" r="14" fill="#3b82f6"/>
      <text x="28" y="32" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text>
      <text x="20" y="62" fill="#dbeafe" font-size="18" font-weight="700">Question</text>
      <text x="20" y="86" fill="#93c5fd" font-size="14">Natural language</text>
    </g>
    <path d="M235 178 H278" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(285 126)">
      <rect width="175" height="105" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="28" cy="27" r="14" fill="#0284c7"/>
      <text x="28" y="32" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">2</text>
      <text x="20" y="62" fill="#e0f2fe" font-size="18" font-weight="700">Embedding</text>
      <text x="20" y="86" fill="#7dd3fc" font-size="14">Ollama</text>
    </g>
    <path d="M465 178 H508" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(515 126)">
      <rect width="175" height="105" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="28" cy="27" r="14" fill="#7c3aed"/>
      <text x="28" y="32" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">3</text>
      <text x="20" y="62" fill="#ede9fe" font-size="18" font-weight="700">Retrieve</text>
      <text x="20" y="86" fill="#c4b5fd" font-size="14">Qdrant top-k schemas</text>
    </g>
    <path d="M695 178 H738" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(745 126)">
      <rect width="175" height="105" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="28" cy="27" r="14" fill="#d97706"/>
      <text x="28" y="32" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">4</text>
      <text x="20" y="62" fill="#fef3c7" font-size="18" font-weight="700">Generate SQL</text>
      <text x="20" y="86" fill="#fcd34d" font-size="14">Ollama chat model</text>
    </g>
    <path d="M925 178 H968" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(975 126)">
      <rect width="175" height="105" rx="18" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
      <circle cx="28" cy="27" r="14" fill="#e11d48"/>
      <text x="28" y="32" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">5</text>
      <text x="20" y="62" fill="#ffe4e6" font-size="18" font-weight="700">Validate</text>
      <text x="20" y="86" fill="#fda4af" font-size="14">Reject unsafe SQL</text>
    </g>
    <path d="M1155 178 H1198" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(1205 126)">
      <rect width="140" height="105" rx="18" fill="#052e2b" stroke="#34d399" stroke-width="2"/>
      <circle cx="28" cy="27" r="14" fill="#059669"/>
      <text x="28" y="32" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">6</text>
      <text x="20" y="62" fill="#d1fae5" font-size="18" font-weight="700">Execute</text>
      <text x="20" y="86" fill="#6ee7b7" font-size="14">Read-only</text>
    </g>
  </g>
</svg>
